[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "story-runtime-core"
version = "0.1.0"
description = "Shared canonical story runtime core for World of Shadows."
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0,<9",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=4.0,<6",
  "pytest-timeout>=2.1",
]
# ``language`` marks installs that import ``story_runtime_core.language_adapter`` (re-export shim).
# Requires ``ai_stack`` on PYTHONPATH — sibling package in this monorepo, not a separate PyPI wheel.
# Repo dev/CI: run from repository root or set PYTHONPATH to include it. See SAD D2 / UML d4-language-adapter-compat-seam.
language = []

# Explicit layout: pyproject.toml lives next to package modules. Newer setuptools
# rejects implicit "flat-layout" multi-module discovery; map the import package
# name to the project root directory.
[tool.setuptools]
package-dir = { "story_runtime_core" = "." }
packages = ["story_runtime_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
