schema_version: akdb.project.v1
project:
  id: better-tomorrow
  name: Better Tomorrow
  repository_id: better-tomorrow-main
  source_mount: /sources/better-tomorrow
  integration_mode: external-read-only
ingestion:
  include:
    - docs/architecture/**/*.md
    - docs/architecture/**/architecture.bindings.json
    - UML/**/*.puml
    - tools/architecture_assurance/**/*.json
