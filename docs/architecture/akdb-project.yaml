    - ArchitecturalKnowledgeDB/**
authority:
  sad: docs/architecture/**/architecture.md
  bindings: docs/architecture/**/architecture.bindings.json
  canon_manifest: docs/architecture/evidence/akdb-canon-manifest.json
  gate_config: tools/architecture_assurance/config.json
