name: MVP1 Experience Identity Tests

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'world-engine/world_engine/runtime/profiles.py'
      - 'world-engine/tests/test_mvp1_experience_identity.py'
      - 'frontend/tests/test_mvp1_play_launcher.py'
      - 'frontend/templates/session_start.html'
      - 'frontend/app/routes_play.py'
      - 'story_runtime_core/builtin_experience_templates.py'
      - 'story_runtime_core/runtime_profile_loader.py'
      - 'content/modules/god_of_carnage/**'
      - 'backend/app/api/v1/game_routes.py'
      - 'backend/app/api/v1/game_routes_impl.py'
      - 'backend/app/services/game_service.py'
      - 'world-engine/world_engine/api/http.py'
      - 'world-engine/world_engine/runtime/manager.py'
      - 'tests/run_tests.py'
      - 'docker-up.py'
      - '.github/workflows/mvp1-tests.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'world-engine/world_engine/runtime/profiles.py'
      - 'world-engine/tests/test_mvp1_experience_identity.py'
      - 'frontend/tests/test_mvp1_play_launcher.py'
      - 'frontend/templates/session_start.html'
      - 'frontend/app/routes_play.py'
      - 'story_runtime_core/builtin_experience_templates.py'
      - 'story_runtime_core/runtime_profile_loader.py'
      - 'content/modules/god_of_carnage/**'
      - 'backend/app/api/v1/game_routes.py'
      - 'backend/app/api/v1/game_routes_impl.py'
      - 'backend/app/services/game_service.py'
      - 'world-engine/world_engine/api/http.py'
      - 'world-engine/world_engine/runtime/manager.py'
      - 'tests/run_tests.py'
      - 'docker-up.py'
      - '.github/workflows/mvp1-tests.yml'

jobs:
  mvp1-world-engine:
    name: MVP1 World Engine Tests (Experience Identity)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            world-engine/requirements.txt
            world-engine/requirements-dev.txt
            ai_stack/pyproject.toml

      - name: Install world-engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./story_runtime_core"
          pip install -e "./ai_stack[test]"
          pip install -r world-engine/requirements-dev.txt
          pip install pyyaml

      - name: Run MVP1 world-engine identity tests via suite catalog
        run: |
          python tests/run_tests.py --suite engine_opening_contracts --quick

  mvp1-frontend:
    name: MVP1 Frontend Tests (Play Launcher)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: frontend/requirements-dev.txt

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements-dev.txt

      - name: Run MVP1 frontend launcher tests via suite catalog
        run: |
          python tests/run_tests.py --suite frontend --quick

  mvp1-tooling-gate:
    name: MVP1 Tooling Gate (tests/run_tests.py and docker-up.py)
    runs-on: ubuntu-latest
    needs: [ mvp1-world-engine, mvp1-frontend ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Verify canonical runner
        run: |
          test -f tests/run_tests.py || (echo "FAIL: tests/run_tests.py missing" && exit 1)
          python tests/run_tests.py --help | grep -E 'mvp1|engine' || (echo "FAIL: mvp1/engine missing from canonical runner" && exit 1)
          test ! -f run_tests.py || (echo "FAIL: forbidden root runner run_tests.py is present" && exit 1)
          echo "PASS: canonical runner present"
