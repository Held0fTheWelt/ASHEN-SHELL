name: MVP2 Runtime State / Content Boundary Regression

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'world-engine/world_engine/runtime/models.py'
      - 'world-engine/world_engine/runtime/profiles.py'
      - 'world-engine/world_engine/runtime/manager.py'
      - 'world-engine/tests/test_mvp1_experience_identity.py'
      - 'story_runtime_core/builtin_experience_templates.py'
      - 'story_runtime_core/runtime_profile_loader.py'
      - 'content/modules/god_of_carnage/**'
      - 'tests/run_tests.py'
      - 'docker-up.py'
      - '.github/workflows/mvp2-tests.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'world-engine/world_engine/runtime/models.py'
      - 'world-engine/world_engine/runtime/profiles.py'
      - 'world-engine/world_engine/runtime/manager.py'
      - 'world-engine/tests/test_mvp1_experience_identity.py'
      - 'story_runtime_core/builtin_experience_templates.py'
      - 'story_runtime_core/runtime_profile_loader.py'
      - 'content/modules/god_of_carnage/**'
      - 'tests/run_tests.py'
      - 'docker-up.py'
      - '.github/workflows/mvp2-tests.yml'

jobs:
  mvp2-world-engine:
    name: MVP2 regression via suite catalog (opening contracts)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            world-engine/requirements.txt
            world-engine/requirements-dev.txt
            ai_stack/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./story_runtime_core"
          pip install -e "./ai_stack[test]"
          pip install -r world-engine/requirements-dev.txt
          pip install pyyaml

      # Dedicated MVP2 actor_lane/state_delta/object_admission modules were retired in Wave 6.
      # Regression coverage stays on opening-contract + experience-identity surfaces.
      - name: Run opening-contract suite via catalog
        run: |
          python tests/run_tests.py --suite engine_opening_contracts --quick

  mvp2-tooling-gate:
    name: MVP2 Tooling Gate (tests/run_tests.py suite engine and artifact existence)
    runs-on: ubuntu-latest
    needs: [ mvp2-world-engine ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Verify canonical runner has engine suite
        run: |
          test -f tests/run_tests.py || (echo "FAIL: tests/run_tests.py missing" && exit 1)
          python tests/run_tests.py --help | grep engine || (echo "FAIL: engine suite missing from canonical runner" && exit 1)
          test ! -f run_tests.py || (echo "FAIL: forbidden root runner run_tests.py is present" && exit 1)
          echo "PASS: canonical runner present with engine suite; root runner absent"

      - name: Verify MVP2 ADRs present
        run: |
          test -f docs/ADR/MVP_Live_Runtime_Completion/adr-mvp2-004-actor-lane-enforcement.md || (echo "FAIL: ADR-004 missing" && exit 1)
          test -f docs/ADR/MVP_Live_Runtime_Completion/adr-mvp2-015-environment-affordances.md || (echo "FAIL: ADR-015 missing" && exit 1)
          test -f docs/ADR/MVP_Live_Runtime_Completion/adr-mvp2-016-operational-gates.md || (echo "FAIL: ADR-016 missing" && exit 1)
          echo "All required MVP2 ADRs present."
