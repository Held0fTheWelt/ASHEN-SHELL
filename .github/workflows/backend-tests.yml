name: Backend Tests

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'backend/**'
      # Drift guard: builtins/models SSOT vs world-engine (story_runtime_core).
      - 'world-engine/world_engine/content/builtins.py'
      - 'world-engine/world_engine/content/models.py'
      # Backend tests under tests/ import ai_stack (e.g. test_goc_evidence_retrieval_governance, test_goc_semantic_parity).
      - 'ai_stack/**'
      - 'story_runtime_core/**'
      - 'tests/requirements_hygiene/**'
      - 'pyproject.toml'
      - 'tests/experience_scoring_cli/**'
      - 'tests/tools/**'
      - 'tools/mcp_server/**'
      - 'database/**'
      - 'scripts/g9_threshold_validator.py'
      - "'fy'-suites/docify/**"
      - 'docs/goc_evidence_templates/**'
      - '.github/workflows/backend-tests.yml'
      - 'tests/run_tests.py'
      - 'setup-test-environment.sh'
      - 'setup-test-environment.bat'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'backend/**'
      - 'world-engine/world_engine/content/builtins.py'
      - 'world-engine/world_engine/content/models.py'
      - 'ai_stack/**'
      - 'story_runtime_core/**'
      - 'tests/requirements_hygiene/**'
      - 'pyproject.toml'
      - 'tests/experience_scoring_cli/**'
      - 'tests/tools/**'
      - 'tools/mcp_server/**'
      - 'database/**'
      - 'scripts/g9_threshold_validator.py'
      - "'fy'-suites/docify/**"
      - 'docs/goc_evidence_templates/**'
      - '.github/workflows/backend-tests.yml'
      - 'tests/run_tests.py'
      - 'setup-test-environment.sh'
      - 'setup-test-environment.bat'

jobs:
  requirements-test-hygiene:
    name: Requirements-test file graph (no full install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=7,<9'
      - name: Static requirements chain via suite catalog
        run: python tests/run_tests.py --suite root_requirements_hygiene --quick
      - name: G9 threshold validator CLI tests via suite catalog
        run: python tests/run_tests.py --suite root_experience_scoring --quick

  backend-fast-tests:
    name: Backend Fast Tests (Unit Tests)
    runs-on: ubuntu-latest
    needs: [ requirements-test-hygiene ]

    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      # W8: suite catalog (full backend under --quick; catalog has no "not slow" scope).
      - name: Run backend fast tests via suite catalog
        run: |
          python tests/run_tests.py --suite backend --quick

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-fast-test-results
          path: test_reports/
          retention-days: 30

  tools-mcp-server-tests:
    name: Tools MCP server tests
    runs-on: ubuntu-latest
    needs: [ requirements-test-hygiene ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: tools/mcp_server/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./tools/mcp_server[test]"
      - name: Run tools/mcp_server tests via suite catalog
        run: |
          python tests/run_tests.py --suite tools_mcp_server --quick

  database-tests:
    name: Database schema and migration tests
    runs-on: ubuntu-latest
    needs: [ requirements-test-hygiene ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run database tests via suite catalog
        run: |
          python tests/run_tests.py --suite database --quick

  # Explicit suite proves Gate G7 Writers' Room tests execute in CI.
  writers-room-g7-contract-tests:
    name: Writers' Room G7 contract tests (suite catalog)
    runs-on: ubuntu-latest
    needs: [ requirements-test-hygiene ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run writers_room suite (G7 operating contract)
        run: |
          python tests/run_tests.py --suite writers_room --quick

  # Explicit suite proves Gate G8 Improvement tests execute in CI.
  improvement-g8-contract-tests:
    name: Improvement G8 contract tests (suite catalog)
    runs-on: ubuntu-latest
    needs: [ requirements-test-hygiene ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run improvement suite (G8 operating contract)
        run: |
          python tests/run_tests.py --suite improvement --quick

  # Gate G10 evidence path via backend suite (includes e2e lifecycle modules).
  g10-backend-e2e-evidence-path:
    name: Gate G10 evidence path (backend E2E via suite catalog)
    runs-on: ubuntu-latest
    needs: [ requirements-test-hygiene ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run backend E2E scope via suite catalog
        run: |
          python tests/run_tests.py --suite backend --scope e2e --quick

  backend-coverage-tests:
    name: Backend Coverage Tests (85% Gate)
    runs-on: ubuntu-latest
    needs:
      [
        backend-fast-tests,
        writers-room-g7-contract-tests,
        improvement-g8-contract-tests,
        g10-backend-e2e-evidence-path,
      ]

    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run backend full tests with coverage via suite catalog
        run: |
          python tests/run_tests.py --suite backend --coverage

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-test-results
          path: test_reports/
          retention-days: 30
