# MkDocs Material site for Better Tomorrow documentation.
# Source lives under docs/ (docs-as-code). This does not replace the GitHub repo view;
# it provides search, nav tabs, and Mermaid rendering for readers who prefer a static site.

site_name: Better Tomorrow Documentation
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

nav:
