openapi: 3.1.0
info:
  title: ArchitecturalKnowledgeDB Knowledge DB API
  version: 0.3.0
  description: Multi-project DB-first architecture knowledge service with linked Git provenance.
servers:
  - url: http://localhost:8787
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /projects:
    get:
      summary: List registered projects
      responses:
        '200': { description: Project list }
    post:
      summary: Register or update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpsert'
      responses:
        '200': { description: Project registered }
  /projects/{project_id}/repositories:
    get:
      summary: List repositories for a project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Repository list }
    post:
      summary: Register repository reference for a project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryRegistration'
      responses:
        '200': { description: Repository registered }
  /projects/{project_id}/index/rebuild:
    post:
      summary: Rebuild structured and FTS indexes for a project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202': { description: Rebuild accepted }
  /projects/{project_id}/git/scan:
    post:
      summary: Read Git metadata for registered repositories
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202': { description: Scan accepted }
  /projects/{project_id}/search:
    post:
      summary: Search project-local and imported shared knowledge
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200': { description: Search results }
  /projects/{project_id}/context-pack:
    post:
      summary: Build an authority-aware agent context pack
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextPackRequest'
      responses:
        '200': { description: Context pack }
  /projects/{project_id}/origin/explain:
    post:
      summary: Explain the origin and evolution of a source path or knowledge item
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OriginExplainRequest'
      responses:
        '200': { description: Origin trail }
  /projects/{project_id}/staleness:
    get:
      summary: Get staleness reports for UML, ADR, rule, or source targets
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Staleness reports }
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ProjectUpsert:
      type: object
      required: [project_id, display_name]
      properties:
        project_id: { type: string }
        display_name: { type: string }
        description: { type: string }
        imports:
          type: array
          items: { type: string }
    RepositoryRegistration:
      type: object
      required: [repository_id, local_path]
      properties:
        repository_id: { type: string }
        local_path: { type: string }
        remote_url_sanitized: { type: string }
        default_branch: { type: string }
        scan_policy:
          type: string
          enum: [manual, startup, scheduled]
        include_patterns:
          type: array
          items: { type: string }
        exclude_patterns:
          type: array
          items: { type: string }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        include_types:
          type: array
          items: { type: string }
        include_shared: { type: boolean, default: true }
        limit: { type: integer, default: 20 }
    ContextPackRequest:
      type: object
      required: [task]
      properties:
        task: { type: string }
        source_paths:
          type: array
          items: { type: string }
        include:
          type: array
          items: { type: string }
        include_git_provenance: { type: boolean, default: true }
        include_staleness: { type: boolean, default: true }
        max_items: { type: integer, default: 20 }
    OriginExplainRequest:
      type: object
      required: [target]
      properties:
        target: { type: string }
        target_type:
          type: string
          enum: [source_path, knowledge_item, uml_element, rule, adr]
        include:
          type: array
          items: { type: string }
